; Compile check for the ESP32 firmware. Arduino IDE users can ignore this file.
;   pio run -d firmware

[platformio]
src_dir = AgriUGV_ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson@^7
