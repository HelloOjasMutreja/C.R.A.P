<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C.R.A.P Rover</title>
<style>
  :root { --bg:#10130f; --panel:#1b201a; --line:#333b30; --text:#edf2e9; --dim:#a6b0a0; --accent:#7ccf6b; --stop:#c8251f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 32px; display:grid; gap:12px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { font-size:18px; margin:0; }
  #link { font-size:14px; color:var(--dim); }
  #link.good { color:var(--accent); }
  #link.bad { color:#ff8a80; font-weight:600; }
  #view { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:3/4; max-height:56vh; width:100%; }
  #view img { width:100%; height:100%; object-fit:contain; display:block; }
  #stale { position:absolute; inset:auto 0 0 0; padding:6px 10px; background:rgba(0,0,0,.7); font-size:14px; display:none; }
  #stop { position:sticky; top:8px; z-index:5; width:100%; min-height:72px; border:0; border-radius:8px; background:var(--stop); color:#fff; font-size:26px; font-weight:700; letter-spacing:1px; cursor:pointer; }
  #stop:active { background:#8f1612; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; display:grid; gap:8px; }
  #verdict { font-size:18px; font-weight:600; }
  #place, #facts { color:var(--dim); font-size:14px; }
  #record { white-space:pre-wrap; font-size:14px; }
  label { display:grid; gap:4px; font-size:14px; color:var(--dim); }
  input { width:100%; padding:10px; font-size:16px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.act { min-height:46px; padding:8px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:#2b3328; color:var(--text); cursor:pointer; }
  button.main { background:var(--accent); border-color:var(--accent); color:#10210b; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  #note { font-size:14px; color:var(--dim); min-height:20px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header><h1>C.R.A.P Rover</h1><span id="link">Connecting</span></header>
  <div id="view"><img id="picture" alt="Live view from the rover"><div id="stale">Picture has stopped</div></div>
  <button id="stop">STOP</button>
  <section aria-live="polite">
    <div id="verdict">Waiting for the rover</div>
    <div id="place"></div>
    <div id="record"></div>
    <div id="facts"></div>
  </section>
  <section>
    <div class="row" id="actions" hidden>
      <button class="act main" id="run" hidden>Run on robot</button>
      <button class="act main" id="approve" hidden>Approve</button>
      <button class="act" id="skip" hidden>Skip</button>
    </div>
    <label>Plants to visit<input id="plants" placeholder="1-5, 7 or 1-6 / 60" autocomplete="off"></label>
    <label>PIN shown on the rover's phone<input id="pin" inputmode="numeric" autocomplete="off"></label>
    <button class="act main" id="start">Start mission</button>
    <div>The rover stops by itself if this page closes during a mission it started.</div>
    <div id="note" role="status"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const note = words => { $("note").textContent = words; };
let lastPicture = 0, lastStatus = 0;

function remember(id) {
  try { $(id).value = localStorage.getItem(id) || ""; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem(id, $(id).value); } catch (e) {} });
}
remember("plants");

async function send(path, needsPin) {
  const headers = needsPin ? { "X-Pin": $("pin").value.trim() } : {};
  try {
    const reply = await fetch(path, { method: "POST", headers });
    note(await reply.text());
  } catch (e) {
    note("Could not reach the rover");
  }
}

$("stop").onclick = () => send("/stop", false);
$("start").onclick = () => send("/mission?plants=" + encodeURIComponent($("plants").value), true);
for (const name of ["run", "approve", "skip"]) $(name).onclick = () => send("/action?do=" + name, true);

async function poll() {
  try {
    const s = await (await fetch("/status")).json();
    lastStatus = Date.now();
    $("link").textContent = s.robot ? "Rover connected" : "Phone only, no rover link";
    $("link").className = s.robot ? "good" : "bad";
    $("verdict").textContent = s.verdict;
    $("place").textContent = s.place;
    $("record").textContent = s.record;
    $("facts").textContent = `${s.ms} ms per frame, phone battery ${s.battery}%, heat: ${s.heat}`;
    $("start").disabled = s.mission;
    $("start").textContent = s.mission ? "Mission running" : "Start mission";
    for (const name of ["run", "approve", "skip"]) $(name).hidden = !s.actions.includes(name);
    $("actions").hidden = s.actions.length === 0;
    if (s.actions.includes("run")) $("run").textContent = s.runWords;
  } catch (e) {
    if (Date.now() - lastStatus > 2000) {
      $("link").textContent = "Lost the phone";
      $("link").className = "bad";
    }
  }
  setTimeout(poll, 500);
}

function nextPicture() {
  const image = new Image();
  const again = () => setTimeout(nextPicture, 250);
  image.onload = () => { $("picture").src = image.src; lastPicture = Date.now(); again(); };
  image.onerror = again;
  image.src = "/frame.jpg?t=" + Date.now();
}
setInterval(() => { $("stale").style.display = Date.now() - lastPicture > 3000 ? "block" : "none"; }, 1000);

poll();
nextPicture();
</script>
</body>
</html>
